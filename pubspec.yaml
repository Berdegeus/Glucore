name: glucore
description: "Aplicativo Flutter com autenticacao local e integracao nativa Sibionics."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  get_it: ^7.7.0
  intl: any
  fl_chart: ^0.69.0
  shared_preferences: ^2.5.5
  mobile_scanner: ^7.2.0
  flutter_local_notifications: ^20.1.0
  google_fonts: ^6.2.1
  sqflite: ^2.4.2
  connectivity_plus: ^7.2.0
  file_picker: ^11.0.2
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.7+1
flutter:
  generate: true
  uses-material-design: true

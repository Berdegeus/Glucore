name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `channel: stable`. An unpinned stable moves on its own, so
      # the runner silently drifts away from the SDK the project is developed
      # against and the build breaks with no commit to blame — which is exactly
      # how the Kotlin job below died on 2026-08-25. Bump this deliberately.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --no-pub --coverage
      # The summary drops tool-generated code from the number (see coverage.py).
      - run: python3 .github/scripts/coverage.py flutter-summary coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          retention-days: 30

  android-unit:
    name: Kotlin unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # android/settings.gradle.kts reads flutter.sdk from local.properties, and
      # the app module depends on the Flutter plugin projects that `pub get`
      # generates — so the Flutter SDK has to be present even for a JVM-only run.
      # Same pin as the job above, and here it is load-bearing: the Flutter
      # Gradle plugin refuses to configure when the wrapper is older than the
      # minimum that SDK version demands. Flutter 3.35.2 accepts the 8.12
      # wrapper in android/gradle/wrapper/gradle-wrapper.properties; a later
      # stable started requiring 8.14.0 and failed the job with
      # `DependencyValidationException`. Move the two together, never one alone.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.2
          channel: stable
          cache: true
      - run: flutter pub get
      # local.properties is gitignored (it is machine-specific), so write it here.
      - run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

  backend:
    name: Backend typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The route tests run against a real database on purpose: they assert the
    # schema's own guarantees (the [patientId, recordedAt] upsert, cascades),
    # which a mocked Prisma client cannot verify.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glucore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/glucore_test?schema=public
      TEST_AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/glucore_auth_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # A database per service, under test too. The service container creates
      # only the one named in POSTGRES_DB; the second is created here. Pointing
      # both suites at one database would let a fixture in either service mask a
      # missing table in the other, which is precisely the coupling the split
      # exists to remove.
      - run: PGPASSWORD=postgres createdb -h localhost -U postgres glucore_auth_test
      - run: npm ci
      # `tsc -b` over the workspace projects, not `tsc --noEmit`: the monorepo
      # builds with project references (`composite: true`), which --noEmit rejects.
      # A bare `npx tsc` here finds no tsconfig at all, prints its help text and
      # exits 0 — a type error would pass the job unnoticed.
      - run: npm run build
      # Coverage rather than a bare test run: rubric #25 wants evidence from a
      # tool, and the thresholds in vitest.config.ts fail the job on a drop.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 30
      - run: python3 ../.github/scripts/coverage.py backend-summary coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
        if: always()

  web:
    name: Web typecheck + lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/docs/architectureDoc.test.ts reads `git log` (ARQ-19); a
          # shallow clone cannot see the refactor commits it cites.
          fetch-depth: 0
      # Same Node line as the backend job: one version in the repository.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      # Zero warnings allowed; the readability limits (complexity, depth,
      # file size, parameters) are errors here.
      - run: npm run lint
      # dependency-cruiser: layer rule, isolated libraries, public feature
      # API and no cycles.
      - run: npm run lint:arch
      # Fails below 80 % of lines in domain and application.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: web/coverage/
          retention-days: 30
      - run: npm run dup
      - run: npm run build
      - run: npm run size
      # Only what ships to the browser; dev tooling advisories do not block.
      - run: npm audit --omit=dev --audit-level=high

  # Publishes the two reports as one page. Only on `main`: a PR run must not
  # overwrite what the default branch shows. Needs Pages set to "GitHub Actions".
  coverage-pages:
    name: Publish coverage to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [flutter, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flutter-coverage
          path: cov/flutter
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: cov/backend
      - run: sudo apt-get install -y --no-install-recommends lcov
      - run: python3 .github/scripts/coverage.py flutter-filter cov/flutter/lcov.info cov/flutter/filtered.info
      - run: |
          mkdir -p site
          genhtml cov/flutter/filtered.info --output-directory site/flutter --title "Glucore Flutter" --quiet
          cp -r cov/backend site/backend
          python3 .github/scripts/coverage.py site cov/flutter/lcov.info cov/backend/coverage-summary.json site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

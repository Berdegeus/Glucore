name: Publish backend images

# Roda só depois que o CI passou na main (main = releases testadas, ver
# docs/guides/versioning-and-branches.md). A VM de produção busca as imagens
# novas sozinha (backend/deploy/update.sh); nenhum acesso SSH a partir daqui.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # workflow_dispatch roda sempre; workflow_run só se o CI terminou verde.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: auth, dir: auth-service }
          - { image: glucose, dir: glucose-service }
          - { image: gateway, dir: gateway }
    steps:
      - uses: actions/checkout@v4
        with:
          # No workflow_run o checkout padrão pegaria o HEAD da branch padrão;
          # queremos exatamente o commit que o CI validou.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/services/${{ matrix.dir }}/Dockerfile
          # A VM Oracle Always Free (E2.1.Micro) é x86_64. Se migrar para o ARM
          # (A1.Flex), troque por linux/arm64 ou publique as duas.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/berdegeus/glucore-${{ matrix.image }}:latest
            ghcr.io/berdegeus/glucore-${{ matrix.image }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
